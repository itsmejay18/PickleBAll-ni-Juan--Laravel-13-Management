; Drop this file at /etc/supervisor/conf.d/pickleball.conf, then run:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start pickleball-worker:*

[program:pickleball-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pickleball/artisan queue:work --tries=3 --backoff=10 --sleep=2 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/pickleball-worker.log
stopwaitsecs=3600
